<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Miyo Yoshinaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FCF2F2;
    --bg-card: #FCFAF6;
    --ink: #2A2823;
    --ink-soft: #6E6A60;
    --line: #DEDACF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP", sans-serif;
    font-weight:300;
    line-height:1.9;
    letter-spacing:0.02em;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:880px; margin:0 auto; padding:0 32px;}

  header{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .headerbar{display:flex; justify-content:flex-end; align-items:center;}
  nav{display:flex; gap:24px; font-size:12px; letter-spacing:0.06em;}
  nav a{color:var(--ink-soft); position:relative; padding-bottom:4px;}
  nav a.active{color:var(--ink);}
  nav a.active::after{
    content:"";
    position:absolute; left:0; bottom:0; width:100%; height:1px; background:var(--ink-soft);
  }

  .page-head{
    padding:28px 0 28px;
    text-align:center;
    background-color:#FFFFFF;
    background-image:
      linear-gradient(90deg, transparent 70px, #F4B8C6 70px, #F4B8C6 71px, transparent 71px),
      linear-gradient(90deg, transparent 74px, #F4B8C6 74px, #F4B8C6 75px, transparent 75px),
      repeating-linear-gradient(0deg, transparent, transparent 27px, #BFE0F0 27px, #BFE0F0 28px);
  }
  .page-head .eyebrow{
    font-family:"Shippori Mincho", serif;
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--ink-soft);
    line-height:28px;
    margin-bottom:28px;
  }
  .page-head h1{
    font-family:"Shippori Mincho", serif;
    font-size:23px;
    font-weight:400;
    letter-spacing:0.08em;
    line-height:28px;
    margin-bottom:28px;
  }
  .page-head p{
    margin-top:0;
    font-size:14px;
    color:var(--ink-soft);
    line-height:28px;
  }

  .contact{
    padding:72px 0 96px;
  }
  .form-wrap{
    max-width:520px;
    margin:0 auto;
  }
  .field{
    margin-bottom:24px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
    margin-bottom:8px;
  }
  .field input, .field textarea{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:10px 2px;
    font-family:"Noto Sans JP", sans-serif;
    font-size:14px;
    font-weight:300;
    color:var(--ink);
  }
  .field textarea{
    resize:vertical;
    min-height:120px;
    line-height:1.9;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-bottom:1px solid var(--ink-soft);
  }
  .submit{
    display:block;
    margin:36px auto 0;
    padding:12px 40px;
    background:transparent;
    border:1px solid var(--ink);
    border-radius:99px;
    font-family:"Shippori Mincho", serif;
    font-size:13px;
    letter-spacing:0.1em;
    color:var(--ink);
    cursor:pointer;
  }

  footer{
    padding:36px 0;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
  }
  footer a{
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
  }
  footer a:hover{
    border-bottom-color:var(--ink-soft);
  }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1W17ZEKRN6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1W17ZEKRN6');
</script>
</head>
<body>

<header>
  <div class="wrap headerbar">
    <nav>
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="works.html">Works</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<section class="page-head">
  <div class="wrap">
    <div class="eyebrow">CONTACT</div>
    <h1>お問い合わせ</h1>
    <p>お仕事のご依頼やお問い合わせは、<br>こちらのフォームからご連絡ください。</p>
  </div>
</section>

<section class="contact">
  <div class="wrap">
    <form class="form-wrap" action="https://formspree.io/f/xaeywjvo" method="POST">
      <div class="field">
        <label>お名前</label>
        <input type="text" name="name" placeholder="山田 太郎" required>
      </div>
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" name="email" placeholder="example@mail.com" required>
      </div>
      <div class="field">
        <label>件名</label>
        <input type="text" name="subject" placeholder="取材のご依頼について">
      </div>
      <div class="field">
        <label>お問い合わせ内容</label>
        <textarea name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
      </div>
      <button class="submit" type="submit">送信する</button>
    </form>
  </div>
</section>

<footer>
  <div class="wrap" style="display:flex; justify-content:center; align-items:center; gap:16px;">
    <span>© 2026 Miyo Yoshinaga</span>
    <a href="privacy-policy/">Privacy Policy</a>
  </div>
</footer>

</body>
</html>
